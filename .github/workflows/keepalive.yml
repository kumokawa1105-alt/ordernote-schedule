name: keepalive

# GitHubは更新の無い静かなリポのscheduleを止めることがあるため、週1で空コミットする。
on:
  schedule:
    - cron: "30 3 * * 1"  # 毎週月曜 JST 12:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive $(date -u +%F)"
          git push
